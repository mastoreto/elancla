# CI runs only on the PR develop -> main (and by hand). Husky is the first barrier on every push.
# Job names are the required status checks of main: do not rename them.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skipped jobs count as passing required checks, so a PR into main from any branch other than
  # develop must fail here (this job is a required check too).
  source-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Only develop may open a PR into main
        if: github.event_name == 'pull_request' && github.head_ref != 'develop'
        run: |
          echo "::error::PRs into main must come from develop (got '${{ github.head_ref }}')."
          exit 1

  quality:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome ci .
      - name: Types
        run: bun run check-types

  # Migrations from scratch, schema drift and the database invariants, on the same ephemeral
  # Postgres (roles, RLS, grants) the local tests use. Compose, not `services:`, because services
  # start before checkout and could not mount init-roles.sh.
  db:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Start the test database
        run: docker compose --env-file .env.test --profile test up -d --wait db-test
      - name: Apply every migration and seed on an empty database
        run: bun run test:db
      - name: Schema matches the migrations (no drift)
        run: bun --env-file=.env.test run --filter @ancla/db db:drift
      - name: Migrations and seed are idempotent
        run: bun run test:db
      - name: Database invariants (RLS, grants, append-only audit)
        run: bun run --filter @ancla/db test

  test:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:infra
      - run: bun run test:db
      - name: Unit and integration tests (api, db, contracts, content, crm, scripts)
        run: bun run test
      # The web talks to the public API only: it must build with no database and no Prisma.
      - name: The web builds without DATABASE_URL and ships no Prisma client
        run: |
          env -u DATABASE_URL bun run --filter web build
          ! grep -rq PrismaClient apps/web/dist

  e2e:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:infra
      - run: bun run test:db
      - name: Install Chromium
        working-directory: apps/crm
        run: bunx playwright install --with-deps chromium
      - name: Build the CRM against the test database
        run: bun --env-file=.env.test run --filter crm build
      - name: Playwright
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/crm/playwright-report/
            apps/crm/test-results/
          retention-days: 7

  # The PR into main must carry a version greater than the last release tag.
  version:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Version is greater than the last release on main
        run: bun scripts/release/assertVersionBumped/assertVersionBumped.ts origin/main
