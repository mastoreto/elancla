# nginx para el sitio estático "el ancla" (Astro, output static, trailingSlash:never).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml
        application/rss+xml;

    # Assets con hash en el nombre → cache inmutable de larga duración.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Fuentes/imágenes públicas → cache moderado.
    location ~* \.(?:woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Páginas: trailingSlash:never genera /ruta/index.html.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Página 404 generada por Astro (src/pages/404.astro → /404.html).
    error_page 404 /404.html;
}
