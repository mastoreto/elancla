# Stack local de ancla-monorepo.
#
# Uso típico (solo BD para desarrollo con `bun run dev`):
#   docker compose up -d db
#   bun run db:push && bun run --filter @ancla/auth seed:admin <email> <pass>
#
# Stack completo en contenedores (BD + migración/seed + backoffice):
#   docker compose --profile app up --build
#
# Puertos: el Postgres se publica en el host en POSTGRES_PORT (default 5433, para
# no chocar con un Postgres local en 5432). Dentro de la red de compose los
# contenedores siempre usan `db:5432` (no afectado por el puerto externo).
# Desde el HOST conectate con localhost:${POSTGRES_PORT} (ver DATABASE_URL en .env).
#
# Variables: copiá .env.example a .env y completá BETTER_AUTH_SECRET (y, si querés
# sembrar un admin automáticamente, SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ancla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ancla}
      POSTGRES_DB: ${POSTGRES_DB:-ancla}
    ports:
      # host:contenedor — el puerto externo es configurable para evitar conflictos
      # con un Postgres local; el interno siempre es 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ancla-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ancla} -d ${POSTGRES_DB:-ancla}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migración del schema (db push) + seed opcional del admin. Corre una vez y sale.
  migrate:
    profiles: ["app", "migrate"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      # Conexión interna a la red de compose (siempre db:5432, no el puerto del host).
      DATABASE_URL: postgresql://${POSTGRES_USER:-ancla}:${POSTGRES_PASSWORD:-ancla}@db:5432/${POSTGRES_DB:-ancla}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?define BETTER_AUTH_SECRET en .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        bun run --filter @ancla/db db:push
        if [ -n "$$SEED_ADMIN_EMAIL" ] && [ -n "$$SEED_ADMIN_PASSWORD" ]; then
          bun run --filter @ancla/auth seed:admin
        else
          echo "SEED_ADMIN_* no definidos; omito el seed del admin."
        fi
    restart: "no"

  # Backoffice iEkklesia (Next.js, salida standalone).
  admin:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    environment:
      NODE_ENV: production
      # Conexión interna a la red de compose (siempre db:5432, no el puerto del host).
      DATABASE_URL: postgresql://${POSTGRES_USER:-ancla}:${POSTGRES_PASSWORD:-ancla}@db:5432/${POSTGRES_DB:-ancla}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?define BETTER_AUTH_SECRET en .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    restart: unless-stopped

  # Sitio público "el ancla" (Astro estático servido con nginx).
  # El sitio lee la config en build-time: para hornear los valores de la BD,
  # construí con DATABASE_URL accesible (build arg); por defecto usa el fallback.
  web:
    profiles: ["app", "web"]
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        DATABASE_URL: ${WEB_BUILD_DATABASE_URL:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  ancla-pgdata:
