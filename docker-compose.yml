# Stack local de ancla-monorepo.
#
# Uso típico (solo BD para desarrollo con `bun run dev`):
#   docker compose up -d db mailpit s3 s3-init
#   bun run db:migrate:deploy && bun run db:seed && bun run --filter @ancla/api invite <email> --role admin
#
# Stack completo en contenedores (BD + migración/seed + backoffice):
#   docker compose --profile app up --build
#
# Puertos: el Postgres se publica en el host en POSTGRES_PORT (default 5433, para
# no chocar con un Postgres local en 5432). Dentro de la red de compose los
# contenedores siempre usan `db:5432` (no afectado por el puerto externo).
# Desde el HOST conectate con localhost:${POSTGRES_PORT} (ver DATABASE_URL en .env).
#
# Variables: copiá .env.example a .env y completá BETTER_AUTH_SECRET. El primer admin se
# crea con la invitación (script `invite`), no hay seed con contraseña.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ancla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ancla}
      POSTGRES_DB: ${POSTGRES_DB:-ancla}
      # Application roles created by packages/db/docker/init-roles.sh.
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:-ancla_migrator}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:-ancla_runtime}
    ports:
      # host:contenedor — el puerto externo es configurable para evitar conflictos
      # con un Postgres local; el interno siempre es 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ancla-pgdata:/var/lib/postgresql/data
      - ./packages/db/docker/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ancla} -d ${POSTGRES_DB:-ancla}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Correo de desarrollo (Mailpit): SMTP en 1025, interfaz y API en http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Storage S3-compatible para archivos y multimedia (SeaweedFS). MinIO dejó de publicar imágenes
  # de la edición comunitaria, así que el contrato S3 lo cubre SeaweedFS con `-s3`.
  # API en http://localhost:9000. Credenciales de desarrollo en docker/seaweedfs/s3.json.
  s3:
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
      # Browser PUTs (presigned uploads) come from the CRM origin.
      - -s3.allowedOrigins=${CRM_ORIGIN:-http://localhost:3000}
    ports:
      - "${S3_PORT:-9000}:9000"
    volumes:
      - ancla-s3data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Crea los buckets `ancla-private` y `ancla-public` (lectura anónima) con su CORS. Corre una vez.
  s3-init:
    image: curlimages/curl:8.11.1
    restart: "no"
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      S3_URL: http://s3:9000
      CRM_ORIGIN: ${CRM_ORIGIN:-http://localhost:3000}
    volumes:
      - ./docker/seaweedfs/init.sh:/init.sh:ro
    depends_on:
      s3:
        condition: service_healthy

  # Migraciones versionadas (migrate deploy) + seed. Corre una vez y sale.
  migrate:
    profiles: ["app", "migrate"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      # Conexión interna a la red de compose (siempre db:5432, no el puerto del host).
      DATABASE_URL: postgresql://app_runtime:${APP_RUNTIME_PASSWORD:-ancla_runtime}@db:5432/${POSTGRES_DB:-ancla}
      DATABASE_MIGRATION_URL: postgresql://app_migrator:${APP_MIGRATOR_PASSWORD:-ancla_migrator}@db:5432/${POSTGRES_DB:-ancla}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?define BETTER_AUTH_SECRET en .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        bun run --filter @ancla/db db:migrate:deploy
        bun run --filter @ancla/db db:seed
    restart: "no"

  # Backoffice iEkklesia (Next.js, salida standalone).
  admin:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    environment:
      NODE_ENV: production
      # Conexión interna a la red de compose (siempre db:5432, no el puerto del host).
      DATABASE_URL: postgresql://app_runtime:${APP_RUNTIME_PASSWORD:-ancla_runtime}@db:5432/${POSTGRES_DB:-ancla}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?define BETTER_AUTH_SECRET en .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-http://localhost:3000}
      CRM_ORIGIN: ${CRM_ORIGIN:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_URL: ${SMTP_URL:?define SMTP_URL en .env}
      MAIL_FROM: ${MAIL_FROM:?define MAIL_FROM en .env}
      # Storage: la API habla con `s3` por la red de compose; el navegador sube a localhost.
      S3_ENDPOINT: http://s3:9000
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-ancla-private}
      S3_PRIVATE_KEY_ID: ${S3_PRIVATE_KEY_ID:-ancla-private-key}
      S3_PRIVATE_SECRET: ${S3_PRIVATE_SECRET:-ancla-private-secret}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-ancla-public}
      S3_PUBLIC_KEY_ID: ${S3_PUBLIC_KEY_ID:-ancla-public-key}
      S3_PUBLIC_SECRET: ${S3_PUBLIC_SECRET:-ancla-public-secret}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/ancla-public}
      CRON_SECRET: ${CRON_SECRET:?define CRON_SECRET en .env}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    restart: unless-stopped

  # Sitio público "el ancla" (Astro estático servido con nginx).
  # El sitio lee la config en build-time: para hornear los valores de la BD,
  # construí con DATABASE_URL accesible (build arg); por defecto usa el fallback.
  web:
    profiles: ["app", "web"]
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        DATABASE_URL: ${WEB_BUILD_DATABASE_URL:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  ancla-pgdata:
  ancla-s3data:
